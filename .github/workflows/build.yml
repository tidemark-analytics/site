name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package for upload
        run: |
          cd dist && zip -qr ../tidemark-site.zip . -x '.DS_Store'
          cd .. && sha256sum tidemark-site.zip > tidemark-site.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: tidemark-site
          path: |
            tidemark-site.zip
            tidemark-site.zip.sha256
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" tidemark-site.zip tidemark-site.zip.sha256 --clobber
